<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a16" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="供朋友使用的共用記帳帳本。" />
    <title>NyanSplit</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <script>
      (() => {
        const isLineInAppBrowser = /\bLine\b/i.test(navigator.userAgent || '');
        const url = new URL(window.location.href);

        if (isLineInAppBrowser && url.searchParams.get('openExternalBrowser') !== '1') {
          url.searchParams.set('openExternalBrowser', '1');
          window.location.replace(url.href);
        }
      })();
    </script>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem('nyan-split-theme') || 'dark';
    </script>
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
      <div class="loading-card">
        <img src="./assets/nyan-cat-loading.gif" alt="Nyan Cat flying through a rainbow" />
        <p id="loading-message">Loading NyanSplit…</p>
        <button id="loading-retry" type="button" hidden>Reload</button>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
    <script>
      window.setTimeout(() => {
        const overlay = document.querySelector('#loading-overlay');
        if (overlay?.hidden) return;

        document.querySelector('#loading-message').textContent = 'NyanSplit is taking too long to start.';
        document.querySelector('#loading-retry').hidden = false;
      }, 12000);
      document.querySelector('#loading-retry').onclick = () => window.location.reload();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((error) => {
            console.warn('Could not register the NyanSplit service worker.', error);
          });
        });
      }
    </script>
  </body>
</html>
